<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹅鹅骑自行车</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20323a;
      --cream: #fffdf4;
      --yellow: #ffc94a;
      --orange: #f47b3e;
      --coral: #ef5d56;
      --teal: #187c7a;
      --sky-top: #9fdef0;
      --sky-bottom: #e8f6e7;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #cdebf0;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 520px;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .title-card {
      position: absolute;
      z-index: 3;
      top: clamp(20px, 5vw, 58px);
      left: clamp(22px, 7vw, 92px);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #176c72;
      font-size: clamp(12px, 1.2vw, 16px);
      font-weight: 800;
      letter-spacing: .22em;
    }

    h1 {
      margin: 0;
      color: #fffdf3;
      font-size: clamp(34px, 5.6vw, 76px);
      line-height: 1;
      letter-spacing: -.05em;
      text-shadow: 0 5px 0 rgba(24, 124, 122, .16);
    }

    .subtitle {
      margin: 12px 0 0;
      color: #28727a;
      font-size: clamp(13px, 1.4vw, 18px);
      font-weight: 700;
    }

    .control {
      position: absolute;
      z-index: 4;
      right: 22px;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 2px solid rgba(32, 50, 58, .12);
      border-radius: 999px;
      padding: 10px 16px;
      background: rgba(255, 253, 244, .82);
      box-shadow: 0 9px 24px rgba(34, 87, 86, .14);
      color: var(--ink);
      font: 800 14px/1 "Microsoft YaHei", system-ui, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform .2s ease, background .2s ease;
    }

    .control:hover { transform: translateY(-2px); background: #fffdf4; }
    .control:focus-visible { outline: 4px solid rgba(255, 201, 74, .8); outline-offset: 3px; }

    .pause-icon {
      width: 14px;
      height: 14px;
      position: relative;
      display: inline-block;
    }

    .pause-icon::before,
    .pause-icon::after {
      content: "";
      position: absolute;
      inset-block: 0;
      width: 4px;
      border-radius: 2px;
      background: var(--teal);
    }

    .pause-icon::before { left: 1px; }
    .pause-icon::after { right: 1px; }

    .paused .pause-icon::before {
      inset: 1px auto 1px 2px;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 10px solid var(--teal);
      border-radius: 0;
      background: transparent;
    }

    .paused .pause-icon::after { display: none; }

    .cloud-far { animation: drift 22s linear infinite; }
    .cloud-near { animation: drift 15s linear infinite reverse; }
    .moving-land { animation: slide-land 4.2s linear infinite; }
    .road-lines { animation: road-dash 1.15s linear infinite; }
    .bike-and-goose { animation: ride-bob .72s ease-in-out infinite; transform-origin: 530px 500px; }
    .wheel { animation: wheel-spin .7s linear infinite; transform-box: view-box; }
    .wheel.back { transform-origin: 340px 500px; }
    .wheel.front { transform-origin: 720px 500px; }
    .crank { animation: wheel-spin .7s linear infinite; transform-origin: 515px 500px; transform-box: view-box; }
    .goose-neck { animation: neck-sway 1.3s ease-in-out infinite; transform-origin: 498px 292px; transform-box: view-box; }
    .goose-wing { animation: wing-flap .72s ease-in-out infinite; transform-origin: 413px 294px; transform-box: view-box; }
    .tail-feathers { animation: tail-wiggle .72s ease-in-out infinite; transform-origin: 337px 291px; transform-box: view-box; }
    .scarf-tail { animation: scarf-wave .9s ease-in-out infinite; transform-origin: 540px 224px; transform-box: view-box; }
    .hat { animation: hat-bounce .72s ease-in-out infinite; transform-origin: 574px 105px; transform-box: view-box; }
    .leg-a { animation: leg-a .7s ease-in-out infinite; transform-origin: 456px 364px; transform-box: view-box; }
    .leg-b { animation: leg-b .7s ease-in-out infinite; transform-origin: 474px 361px; transform-box: view-box; }
    .dust.one { animation: dust 1.4s ease-out infinite; }
    .dust.two { animation: dust 1.4s .55s ease-out infinite; }
    .dust.three { animation: dust 1.4s .95s ease-out infinite; }

    @keyframes drift {
      from { transform: translateX(-70px); }
      to { transform: translateX(170px); }
    }

    @keyframes slide-land {
      from { transform: translateX(0); }
      to { transform: translateX(-300px); }
    }

    @keyframes road-dash {
      from { transform: translateX(0); }
      to { transform: translateX(-210px); }
    }

    @keyframes ride-bob {
      0%, 100% { transform: translateY(0) rotate(-.15deg); }
      50% { transform: translateY(-7px) rotate(.2deg); }
    }

    @keyframes wheel-spin { to { transform: rotate(360deg); } }

    @keyframes neck-sway {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(2deg); }
    }

    @keyframes wing-flap {
      0%, 100% { transform: rotate(-5deg) scaleY(1); }
      50% { transform: rotate(8deg) scaleY(.84); }
    }

    @keyframes tail-wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(8deg); }
    }

    @keyframes scarf-wave {
      0%, 100% { transform: skewY(-2deg) rotate(1deg); }
      50% { transform: skewY(6deg) rotate(-4deg); }
    }

    @keyframes hat-bounce {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-3px) rotate(-2deg); }
    }

    @keyframes leg-a {
      0%, 100% { transform: rotate(7deg); }
      50% { transform: rotate(-12deg); }
    }

    @keyframes leg-b {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }

    @keyframes dust {
      0% { opacity: 0; transform: translate(0, 0) scale(.35); }
      30% { opacity: .55; }
      100% { opacity: 0; transform: translate(-75px, -25px) scale(1.15); }
    }

    .paused .animated,
    .paused .animated * {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .animated,
      .animated * { animation-play-state: paused !important; }
      .control { display: none; }
    }

    @media (max-aspect-ratio: 4/5) {
      .title-card { top: 28px; left: 50%; width: 90%; text-align: center; transform: translateX(-50%); }
      .stage svg { width: 165%; margin-left: -42%; }
      .subtitle { display: none; }
    }
  </style>
</head>

<body>
  <main class="stage" id="stage">
    <header class="title-card" aria-hidden="true">
      <p class="eyebrow">HAPPY LITTLE RIDE</p>
      <h1>鹅鹅出发啦！</h1>
      <p class="subtitle">沿着风的方向，叮铃铃地去远方。</p>
    </header>

    <svg class="animated" viewBox="0 0 1200 700" role="img" aria-labelledby="svgTitle svgDesc" preserveAspectRatio="xMidYMid slice">
      <title id="svgTitle">鹅骑自行车的二维动画</title>
      <desc id="svgDesc">一只戴红帽、系围巾的白鹅，骑着黄色自行车穿过乡间小路。</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8fd7ed" />
          <stop offset=".68" stop-color="#dff3df" />
          <stop offset="1" stop-color="#f9e9a5" />
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#76928f" />
          <stop offset="1" stop-color="#536d6e" />
        </linearGradient>
        <linearGradient id="framePaint" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd85c" />
          <stop offset="1" stop-color="#f09c28" />
        </linearGradient>
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
          <feGaussianBlur stdDeviation="8" />
        </filter>
        <filter id="gooseShadow" x="-25%" y="-25%" width="150%" height="170%">
          <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#315456" flood-opacity=".18" />
        </filter>
        <pattern id="roadTexture" width="34" height="34" patternUnits="userSpaceOnUse">
          <circle cx="5" cy="10" r="1.3" fill="#a4b2aa" opacity=".18" />
          <circle cx="25" cy="25" r="1" fill="#263f43" opacity=".13" />
        </pattern>
      </defs>

      <!-- Sky -->
      <rect width="1200" height="700" fill="url(#sky)" />
      <circle cx="1030" cy="107" r="58" fill="#fff2a9" opacity=".7" />
      <circle cx="1030" cy="107" r="79" fill="none" stroke="#fff5bf" stroke-width="3" opacity=".42" />

      <g class="cloud-far" fill="#fffdf4" opacity=".62">
        <path d="M90 168c12-25 50-25 62-3 23-11 52 5 50 30H61c-4-19 10-30 29-27Z" />
        <path d="M790 185c9-20 39-23 54-6 19-12 47 2 49 24H760c0-15 13-24 30-18Z" />
      </g>
      <g class="cloud-near" fill="#fffdf4" opacity=".88">
        <path d="M357 103c15-29 59-31 76-4 29-12 61 7 58 37H318c-2-21 17-36 39-33Z" />
        <path d="M1000 241c11-22 44-24 59-4 21-11 48 4 48 28H970c-1-17 14-28 30-24Z" />
      </g>

      <!-- Distant hills -->
      <path d="M0 359C96 290 179 334 263 295c101-46 158 46 252 15 105-34 161-86 278-28 94 47 174-24 258-4 67 16 112 48 149 65v170H0Z" fill="#88bf91" />
      <path d="M0 391c111-50 194-1 293-31 111-33 202 40 308 6 131-42 203-56 324-1 95 43 177-7 275-2v154H0Z" fill="#64a77b" />

      <!-- Moving shrubs and trees -->
      <g class="moving-land">
        <g transform="translate(40 276)">
          <rect x="47" y="91" width="17" height="106" rx="8" fill="#7d694d" />
          <circle cx="55" cy="61" r="58" fill="#3e8f6a" />
          <circle cx="23" cy="84" r="38" fill="#4ea376" />
          <circle cx="86" cy="88" r="42" fill="#62b080" />
        </g>
        <g transform="translate(930 322) scale(.72)">
          <rect x="47" y="91" width="17" height="106" rx="8" fill="#7d694d" />
          <circle cx="55" cy="61" r="58" fill="#3e8f6a" />
          <circle cx="23" cy="84" r="38" fill="#4ea376" />
          <circle cx="86" cy="88" r="42" fill="#62b080" />
        </g>
        <g transform="translate(1240 288) scale(.92)">
          <rect x="47" y="91" width="17" height="106" rx="8" fill="#7d694d" />
          <circle cx="55" cy="61" r="58" fill="#3e8f6a" />
          <circle cx="23" cy="84" r="38" fill="#4ea376" />
          <circle cx="86" cy="88" r="42" fill="#62b080" />
        </g>
        <g fill="#2f8b63">
          <path d="M211 449c8-30 25-35 30 0 13-33 31-22 29 9h-67Z" />
          <path d="M849 447c8-30 25-35 30 0 13-33 31-22 29 9h-67Z" />
          <path d="M1110 450c8-30 25-35 30 0 13-33 31-22 29 9h-67Z" />
          <path d="M1448 445c8-30 25-35 30 0 13-33 31-22 29 9h-67Z" />
        </g>
      </g>

      <!-- Ground and road -->
      <path d="M0 447c208-22 376 6 593-9 217-14 391-8 607 7v44H0Z" fill="#87bb6a" />
      <rect y="477" width="1200" height="223" fill="url(#road)" />
      <rect y="477" width="1200" height="223" fill="url(#roadTexture)" />
      <path d="M0 486c271-13 512 8 742-3 196-9 311 3 458-2" fill="none" stroke="#dce1c3" stroke-width="6" opacity=".55" />
      <g class="road-lines" fill="#f9e7a5" opacity=".72">
        <rect x="-150" y="628" width="132" height="10" rx="5" />
        <rect x="60" y="628" width="132" height="10" rx="5" />
        <rect x="270" y="628" width="132" height="10" rx="5" />
        <rect x="480" y="628" width="132" height="10" rx="5" />
        <rect x="690" y="628" width="132" height="10" rx="5" />
        <rect x="900" y="628" width="132" height="10" rx="5" />
        <rect x="1110" y="628" width="132" height="10" rx="5" />
        <rect x="1320" y="628" width="132" height="10" rx="5" />
      </g>

      <ellipse cx="530" cy="603" rx="300" ry="26" fill="#263f43" opacity=".18" filter="url(#softShadow)" />

      <!-- Dust puffs -->
      <g fill="#dae2cc">
        <circle class="dust one" cx="235" cy="568" r="13" />
        <circle class="dust two" cx="268" cy="582" r="8" />
        <circle class="dust three" cx="217" cy="590" r="10" />
      </g>

      <!-- Bicycle + goose -->
      <g class="bike-and-goose" filter="url(#gooseShadow)">
        <!-- Wheels -->
        <g class="wheel back">
          <circle cx="340" cy="500" r="113" fill="#e9f2e9" fill-opacity=".12" stroke="#23363c" stroke-width="14" />
          <circle cx="340" cy="500" r="103" fill="none" stroke="#f6f2d8" stroke-width="3" />
          <g stroke="#d6e0d8" stroke-width="3" opacity=".9">
            <path d="M340 397v206M237 500h206M267 427l146 146M413 427 267 573M289 405l102 190M435 449 245 551M245 449l190 102M391 405 289 595" />
          </g>
          <circle cx="340" cy="500" r="12" fill="#273d42" stroke="#f4c64a" stroke-width="5" />
        </g>

        <g class="wheel front">
          <circle cx="720" cy="500" r="113" fill="#e9f2e9" fill-opacity=".12" stroke="#23363c" stroke-width="14" />
          <circle cx="720" cy="500" r="103" fill="none" stroke="#f6f2d8" stroke-width="3" />
          <g stroke="#d6e0d8" stroke-width="3" opacity=".9">
            <path d="M720 397v206M617 500h206M647 427l146 146M793 427 647 573M669 405l102 190M815 449 625 551M625 449l190 102M771 405 669 595" />
          </g>
          <circle cx="720" cy="500" r="12" fill="#273d42" stroke="#f4c64a" stroke-width="5" />
        </g>

        <!-- Bicycle frame -->
        <g fill="none" stroke="url(#framePaint)" stroke-linecap="round" stroke-linejoin="round">
          <path d="M340 500 447 360 515 500 340 500 462 420 642 420 515 500" stroke-width="17" />
          <path d="M642 420 720 500M642 420 628 339" stroke-width="14" />
        </g>
        <path d="M607 338h72" fill="none" stroke="#273d42" stroke-width="12" stroke-linecap="round" />
        <path d="M421 353h75" fill="none" stroke="#273d42" stroke-width="15" stroke-linecap="round" />
        <path d="M461 355 515 500" fill="none" stroke="#e9a632" stroke-width="8" />

        <!-- Crank and pedals -->
        <g class="crank">
          <circle cx="515" cy="500" r="25" fill="#f8cf4f" stroke="#273d42" stroke-width="7" />
          <path d="M515 500 557 522M515 500 473 478" stroke="#273d42" stroke-width="7" stroke-linecap="round" />
          <path d="M548 526h25M457 474h25" stroke="#273d42" stroke-width="8" stroke-linecap="round" />
        </g>

        <!-- Goose body -->
        <g>
          <g class="tail-feathers" fill="#fffdf4" stroke="#d7e0d7" stroke-width="4" stroke-linejoin="round">
            <path d="M350 292c-38-22-73-16-97 3 25 7 43 20 59 39 12-9 25-22 38-42Z" />
            <path d="M360 303c-33 1-55 19-66 42 27-5 47-2 66 8 8-15 9-33 0-50Z" />
          </g>
          <path d="M337 282c29-52 107-68 163-29 52 36 56 105 4 127-48 20-136 8-167-35-14-20-14-42 0-63Z" fill="#fffdf4" stroke="#d7e0d7" stroke-width="5" />
          <path d="M348 300c-15 22-12 45 11 61 23 15 59 21 90 18" fill="none" stroke="#edf0e5" stroke-width="10" stroke-linecap="round" />

          <!-- Wing -->
          <g class="goose-wing">
            <path d="M388 276c33-20 83-6 96 27 10 25-7 49-39 49-37 0-69-29-57-76Z" fill="#f1f0df" stroke="#d7e0d7" stroke-width="5" />
            <path d="M405 303c18 14 37 20 58 14M410 323c13 9 27 13 42 12" fill="none" stroke="#cbd6ce" stroke-width="4" stroke-linecap="round" />
          </g>
        </g>

        <!-- Back leg -->
        <g class="leg-b">
          <path d="M453 347c-2 39 12 65 46 84l-24 47" fill="none" stroke="#edae45" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M459 478h39" fill="none" stroke="#f47b3e" stroke-width="12" stroke-linecap="round" />
        </g>

        <!-- Neck, head, accessories -->
        <g class="goose-neck">
          <path d="M478 300c25-15 33-42 28-76-9-62 4-104 45-124 41-20 96-3 104 34 7 34-25 59-67 55-9 37-13 85 10 119-21 23-85 25-120-8Z" fill="#fffdf4" stroke="#d7e0d7" stroke-width="5" stroke-linejoin="round" />
          <path d="M509 284c21 12 50 16 77 4" fill="none" stroke="#edf0e5" stroke-width="9" stroke-linecap="round" />
          <ellipse cx="580" cy="137" rx="50" ry="44" fill="#fffdf4" />
          <circle cx="597" cy="127" r="7.5" fill="#20323a" />
          <circle cx="599" cy="124" r="2.4" fill="#fff" />
          <path d="M621 143c32-8 58-1 76 14-23 16-48 21-79 12 9-8 10-17 3-26Z" fill="#f47b3e" stroke="#d65e32" stroke-width="4" stroke-linejoin="round" />
          <path d="M644 157h42" stroke="#c64e2d" stroke-width="3" stroke-linecap="round" />

          <!-- Scarf -->
          <path d="M529 214c31 13 61 13 89-1l2 29c-31 12-60 11-88-3Z" fill="#ef5d56" stroke="#d64648" stroke-width="4" />
          <g class="scarf-tail">
            <path d="M542 229c-10 27-28 53-54 76 27 3 53 13 73 29 7-37 6-71-2-103Z" fill="#ef5d56" stroke="#d64648" stroke-width="4" stroke-linejoin="round" />
            <path d="M524 283c10 4 20 9 29 16" fill="none" stroke="#ffc8ae" stroke-width="5" stroke-linecap="round" />
          </g>

          <!-- Hat -->
          <g class="hat">
            <path d="M536 102c5-46 43-61 77-36 10 8 14 21 12 37Z" fill="#ef5d56" stroke="#d64648" stroke-width="5" />
            <path d="M531 103c35-10 68-9 101 2" fill="none" stroke="#d64648" stroke-width="10" stroke-linecap="round" />
            <circle cx="614" cy="62" r="12" fill="#fff7e4" stroke="#d7e0d7" stroke-width="3" />
          </g>
        </g>

        <!-- Front leg overlays frame -->
        <g class="leg-a">
          <path d="M468 351c8 38 29 58 65 74l24 81" fill="none" stroke="#f2b64c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M545 511h43" fill="none" stroke="#f47b3e" stroke-width="12" stroke-linecap="round" />
        </g>

        <!-- Handle grip and bell -->
        <path d="M625 338h51" stroke="#20323a" stroke-width="10" stroke-linecap="round" />
        <circle cx="627" cy="332" r="12" fill="#f6cf4f" stroke="#20323a" stroke-width="4" />
        <path d="M627 320v-7" stroke="#20323a" stroke-width="4" stroke-linecap="round" />
      </g>

      <!-- Foreground grass -->
      <g fill="none" stroke="#d8e1ba" stroke-width="4" stroke-linecap="round" opacity=".7">
        <path d="M67 687c8-28 15-38 18-46M85 687c-1-24 6-39 20-50M1035 695c-3-26 4-44 18-58M1051 695c9-28 20-41 35-51" />
      </g>
    </svg>

    <button class="control" id="toggleAnimation" type="button" aria-pressed="false" aria-label="暂停动画">
      <span class="pause-icon" aria-hidden="true"></span>
      <span class="control-label">暂停一下</span>
    </button>
  </main>

  <script>
    const stage = document.querySelector('#stage');
    const button = document.querySelector('#toggleAnimation');
    const label = button.querySelector('.control-label');

    button.addEventListener('click', () => {
      const isPaused = stage.classList.toggle('paused');
      button.setAttribute('aria-pressed', String(isPaused));
      button.setAttribute('aria-label', isPaused ? '继续动画' : '暂停动画');
      label.textContent = isPaused ? '继续出发' : '暂停一下';
    });
  </script>
</body>
</html>
